name: Typecheck

# Catches build-breakers (unresolved imports, type errors) BEFORE they reach
# production. Runs on every PR and on push to main. The deploy workflow also
# depends on this passing, so a red typecheck can't be deployed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
